name: NFSMWOnline
options:
  bundleIdPrefix: com.ibaal
  deploymentTarget:
    iOS: "15.0"
  compatibilityVersion: "Xcode 14.0"

targets:
  NFSMWOnline:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ConsoleApp
    info:
      properties:
        CFBundleDisplayName: "NFS MW Online"
        UILaunchScreen: {}  # Ini kunci utama agar iOS mendeteksi dukungan layar penuh iPhone modern
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIInterfaceOrientation: UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: "NFSMWOnline"
        PRODUCT_BUNDLE_IDENTIFIER: "com.ibaal.nfsmwo.game"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
